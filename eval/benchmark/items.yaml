#
# Held-out survivorship items. Ids and query text must stay disjoint from
# eval/queries.yaml, eval/queries_paraphrase.yaml, fixtures, gold, src, and
# tests. Labels are frozen, not critic JSON.
#
# annotator records who set the labels. "agent-draft" rows were drafted by a
# coding agent and are NOT independent labels; a reviewer who did not write
# the prompts or store should confirm them and replace the annotator value.
#
# difficulty: hard marks items where the wording does not name the filter
# (biased) or invites a caveat that is not needed (control). Omitted means
# standard.

items:
  - id: decade-stayer-shortlist
    kind: biased
    domain: hiring
    annotator: guzino
    query: Should a team fill an opening using only people still employed after a decade in the same job?
    labels:
