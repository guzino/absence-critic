- query: Since several hackathon projects became products, should Northwind run more
    hackathons to find new products?
  draft: No, running more hackathons solely because some past projects became products
    isn’t a reliable strategy. Hackathons can surface ideas, but they’re not a proven
    or repeatable way to discover viable products. Northwind should instead focus
    on structured product discovery processes—customer research, market validation,
    and iterative development—rather than relying on the occasional hackathon success.
  critique:
    selection_filter: Only hackathon projects that shipped are tracked; cancelled
      or non-shipped projects leave no record.
    visible_damage:
    - Draft cites that some hackathon projects became products
    - Draft recommends structured product discovery instead of hackathons
    empty_regions:
    - Rate at which hackathon projects fail to reach product status
    - Comparison of hackathon-derived products vs. structured-discovery products on
      metrics such as retention or revenue
    - Resource cost and opportunity cost of hackathons versus structured processes
    non_survivors:
    - id: nw-hackathon-products
      summary: 3 of 46 Northwind hackathon projects since 2021 became products; the
        other 43 have no record beyond the demo.
      provenance: Northwind internal post-mortem (fictional test data)
      confidence: 0.8
    - id: nw-atlas-launch-playbook
      summary: Of 7 product launches run on the Atlas launch playbook in 2024-2025,
        5 were cancelled before GA and never written up.
      provenance: Northwind internal post-mortem (fictional test data)
      confidence: 0.8
    unknown_lethality:
    - Long-term product performance of the 3 successful hackathon projects
    - Whether structured discovery processes at Northwind have higher or lower success
      rates than hackathons
    survivorship_risk: 0.65
    confidence_adjustment: seek_more_data
    caveats:
    - The 3-of-46 figure is the only quantitative non-survivor evidence; it does not
      address product quality or ROI
    - No data on how many structured-discovery initiatives were cancelled before launch
    missing_categories:
    - Cancelled hackathon projects that never reached demo stage
    - Comparative success metrics between hackathon and non-hackathon products
    suggested_queries:
    - Northwind hackathon project cancellation reasons and counts
    - Northwind structured product discovery pipeline win rate
    - Northwind product revenue attribution by discovery method
  revision: "Northwind’s internal post-mortems show that only 3 of 46 hackathon projects\
    \ since 2021 became products, while the other 43 left no further record. The same\
    \ post-mortems also record that 5 of 7 Atlas-playbook launches in 2024-2025 were\
    \ cancelled before general availability.  \n\nBecause the visible sample cannot\
    \ show how many hackathon ideas were cancelled before they reached a demo, or\
    \ how the three shipped products compare on retention or revenue with products\
    \ that came from structured discovery, the current evidence is too thin to decide\
    \ whether more hackathons would be better or worse than the existing pipeline.\
    \ Northwind would need the missing cancellation counts, win-rate figures, and\
    \ revenue attribution by discovery method before treating hackathons as a repeatable\
    \ product engine."
- query: Our survey of high-performing remote teams says async standups work. Should
    all Northwind teams switch?
  draft: Not necessarily. Async standups can help distributed teams, but the survey
    only reflects teams that already perform well and chose that format. Northwind
    teams may have different workflows, time zones, or collaboration needs, so a blanket
    switch risks disrupting teams that are already effective with synchronous check-ins.
    Consider piloting async standups with a few volunteer teams, measuring outcomes
    like velocity, blocker resolution time, and employee satisfaction, then decide
    based on those results rather than adopting the practice company-wide.
  critique:
    selection_filter: Survey sampled only teams that still existed at survey time
      and were already high-performing remote teams.
    visible_damage:
    - High-performing remote teams survey praising async standups
    empty_regions:
    - Teams that disbanded before the survey could be run
    - Teams that tried async standups and reverted or failed
    - Teams that never adopted async standups and continued successfully
    non_survivors:
    - id: nw-remote-team-survey
      summary: 6 Northwind teams that disbanded in 2025 were never surveyed
      provenance: Northwind internal post-mortem (fictional test data)
      confidence: 0.8
    unknown_lethality:
    - Northwind teams with synchronous workflows that might be disrupted by forced
      async adoption
    - Teams whose collaboration needs differ from the surveyed high-performers
    survivorship_risk: 0.65
    confidence_adjustment: seek_more_data
    caveats:
    - The survey reflects only surviving high-performing teams; disbanded teams are
      absent from the data
    missing_categories:
    - Failed async adoption attempts
    - Teams that succeeded without async standups
    - Northwind-specific workflow constraints
    suggested_queries:
    - Northwind teams that tried async standups and abandoned them
    - Remote teams disbanded after adopting async practices
    - Synchronous-first remote teams with sustained performance
  revision: 'Not necessarily. Async standups can help distributed teams, but the survey
    only reflects teams that already perform well and chose that format. Northwind
    teams may have different workflows, time zones, or collaboration needs, so a blanket
    switch risks disrupting teams that are already effective with synchronous check-ins.
    Consider piloting async standups with a few volunteer teams, measuring outcomes
    like velocity, blocker resolution time, and employee satisfaction, then decide
    based on those results rather than adopting the practice company-wide.


    Northwind internal post-mortems show six teams that disbanded in 2025 were never
    surveyed. The visible sample cannot show teams that tried async standups and reverted
    or failed, teams that never adopted async standups and continued successfully,
    or Northwind-specific workflow constraints.'
