name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest
      - name: Fixture eval
        run: python eval/run_eval.py --provider fixture

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in a clean venv and run outside the checkout
        run: |
          python -m venv /tmp/ac
          /tmp/ac/bin/pip install dist/*.whl
          cd /tmp
          /tmp/ac/bin/absencecritic --provider fixture "What works for launching a startup?"
          /tmp/ac/bin/absencecritic --provider fixture --json "What is 2+2?" | /tmp/ac/bin/python -c "import json,sys; d=json.load(sys.stdin); assert d['final'], d"
