[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "absencecritic"
version = "0.1.5"
description = "Survivorship-bias shield (Wald Module) for language models"
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name = "Guzino" },
]
requires-python = ">=3.10"
keywords = ["survivorship bias", "llm", "critic", "missing data", "abraham wald"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
absencecritic = "absencecritic.cli:main"

[project.urls]
Homepage = "https://github.com/guzino/absence-critic"
Repository = "https://github.com/guzino/absence-critic"
Issues = "https://github.com/guzino/absence-critic/issues"
Changelog = "https://github.com/guzino/absence-critic/blob/main/CHANGELOG.md"
Author = "https://github.com/guzino"

[tool.hatch.build.targets.wheel.force-include]
"src/absencecritic/prompts/draft.md" = "absencecritic/prompts/draft.md"
"src/absencecritic/prompts/critic.md" = "absencecritic/prompts/critic.md"
"src/absencecritic/prompts/revise.md" = "absencecritic/prompts/revise.md"
"src/absencecritic/prompts/critic_design.md" = "absencecritic/prompts/critic_design.md"
"src/absencecritic/prompts/expand.md" = "absencecritic/prompts/expand.md"
"src/absencecritic/prompts/score_design.md" = "absencecritic/prompts/score_design.md"
"data/non_survivors/entries.yaml" = "absencecritic/_data/non_survivors/entries.yaml"
"data/non_survivors/design_failures.yaml" = "absencecritic/_data/non_survivors/design_failures.yaml"
"eval/fixtures/responses.yaml" = "absencecritic/_data/fixtures/responses.yaml"
"eval/generative/fixtures.yaml" = "absencecritic/_data/generative/fixtures.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
